# ==============================================================================
# OT-SA-Tools Build Configuration (ABI 25.7 - FreeBSD 14.3)
# ==============================================================================
#
# >>> FILE NÀY ĐƯỢC COMMIT VÀO GIT - KHÔNG SỬA TRỰC TIẾP CHO CÁ NHÂN <<<
#
# File này định nghĩa các biến MẶC ĐỊNH chung của dự án.
# Mọi developer khi clone repo đều thấy file này.
#
# ------------------------------------------------------------------------------
# Để TUỲ CHỈNH CỤC BỘ (chỉ trên máy của bạn, không ảnh hưởng team):
# ------------------------------------------------------------------------------
#
# Tạo file `build.conf.local` cùng thư mục (đã được .gitignore):
#
#     # config/25.7/build.conf.local
#     PYTHON=312                              # Force set Python 3.12
#     GITBASE=https://github.com/my-fork      # Dùng fork riêng
#     VERBOSE=1                               # Bật verbose mode
#
# QUY TẮC:
#   - File này (build.conf):       LUÔN dùng `?=` (set if undefined)
#   - File build.conf.local:       LUÔN dùng `=`  (force override)
#   - Nếu dùng `?=` trong .local thì override KHÔNG có hiệu lực!
#
# Cú pháp Makefile:
#   ?= : chỉ set nếu biến chưa được set
#   =  : set giá trị cố định (override mọi nơi khác)
#
# Thứ tự ưu tiên (cao → thấp):
#   1. Dòng lệnh:        make XXX=value
#   2. build.conf.local: XXX=value (force override)
#   3. build.conf:       XXX?=value (file này, mặc định)
#   4. Makefile default
# ==============================================================================


# ------------------------------------------------------------------------------
# 1. Phiên bản OS và ngôn ngữ (CORE)
# ------------------------------------------------------------------------------
# Các biến này định nghĩa phiên bản phần mềm core dùng để build ports/plugins.
# THÔNG THƯỜNG KHÔNG NÊN THAY ĐỔI - phải đồng bộ với ports tree.

# APACHE: Phiên bản Apache HTTP Server (24 = 2.4)
APACHE?=	24

# LUA: Phiên bản Lua
LUA?=		5.4

# OS: Phiên bản FreeBSD đích (phải khớp với uname -r)
OS?=		14.3

# PERL: Phiên bản Perl (5.42)
PERL?=		5.42

# PHP: Phiên bản PHP (83 = 8.3)
PHP?=		83

# PYTHON: Phiên bản Python (311 = 3.11)
PYTHON?=	311

# RUBY: Phiên bản Ruby (33 = 3.3)
RUBY?=		33

# SSL: Thư viện SSL: openssl | libressl
SSL?=		openssl


# ------------------------------------------------------------------------------
# 2. Cấu hình sản phẩm (PRODUCT)
# ------------------------------------------------------------------------------
# Các biến điều chỉnh tên và phiên bản image đầu ra.

#NAME?=		OPNsense          # Tên sản phẩm hiển thị (mặc định: OPNsense)
#TYPE?=		${NAME:tl}        # Tên cơ sở của top package (mặc định: lowercase NAME)
#SUFFIX?=	                  # Hậu tố: '' | '-business' | '-devel'
#VERSION?=	                  # Nhãn phiên bản (mặc định: timestamp YYYYMMDDHHMM)
#ABI?=		25.7              # ABI version string (mặc định: tên thư mục config)


# ------------------------------------------------------------------------------
# 3. Kiến trúc và thiết bị (ARCHITECTURE)
# ------------------------------------------------------------------------------
# Cấu hình kiến trúc CPU và profile thiết bị mục tiêu.

#ARCH?=		amd64             # Kiến trúc đích: amd64 | aarch64
#DEVICE?=	A10               # Profile thiết bị: A10 | ARM64 | R4S | RPI | ROCKPRO64
#KERNEL?=	SMP               # Cấu hình kernel: SMP | SMP-ARM | <custom>
#DEBUG?=	                  # Bật build debug kernel: '' | 'debug'


# ------------------------------------------------------------------------------
# 4. Console và Boot
# ------------------------------------------------------------------------------

#COMSPEED?=	115200            # Tốc độ baud serial console (115200, 9600, ...)
#UEFI?=		arm dvd serial vga vm  # Image dùng UEFI hybrid boot (space-separated)
#ZFS?=		                  # Tên ZFS pool cho VM image (rỗng = dùng UFS)


# ------------------------------------------------------------------------------
# 5. Repository URLs (GIT)
# ------------------------------------------------------------------------------
# Cấu hình git base URL và URLs cụ thể cho từng repo.
# CHÚ Ý: Có thể dùng repositories.yaml (chi tiết hơn) thay vì các biến này.

#GITBASE?=	https://github.com/opnsense    # Base URL cho core/plugins/ports/src/tools
#PORTSREFURL?=	https://git.FreeBSD.org/ports.git  # FreeBSD ports reference

# Mirror servers cho prefetch và clone (space-separated)
#MIRRORS?=	https://opnsense.c0urier.net \
#		https://mirrors.nycbug.org/pub/opnsense \
#		https://mirror.wdc1.us.leaseweb.net/opnsense \
#		https://mirror.sfo12.us.leaseweb.net/opnsense \
#		https://mirror.fra10.de.leaseweb.net/opnsense \
#		https://mirror.ams1.nl.leaseweb.net/opnsense


# ------------------------------------------------------------------------------
# 6. Repository Branches (GIT BRANCHES)
# ------------------------------------------------------------------------------
# Branch của từng repo khi clone/update.

#COREBRANCH?=	stable/${ABI}   # Branch của core repo
#PLUGINSBRANCH?=stable/${ABI}   # Branch của plugins repo
#PORTSBRANCH?=	master          # Branch của ports repo
#PORTSREFBRANCH?=main           # Branch của freebsd-ports
#SRCBRANCH?=	stable/${ABI}   # Branch của FreeBSD src
#TOOLSBRANCH?=	master          # Branch của tools repo
#EXTRABRANCH?=	                # Branch phụ (cho nightly EXTRABRANCH=master)


# ------------------------------------------------------------------------------
# 7. Đường dẫn (PATHS)
# ------------------------------------------------------------------------------
# Các thư mục lưu trữ source code và build artifacts.

#ROOTDIR?=	/usr                       # Thư mục gốc chứa các repo
#TOOLSDIR?=	${ROOTDIR}/tools           # Repo này (OT-SA-Tools)
#COREDIR?=	${ROOTDIR}/core            # Repo OT-SA core
#PLUGINSDIR?=	${ROOTDIR}/plugins         # Repo OT-SA plugins
#PORTSDIR?=	${ROOTDIR}/ports           # Repo OT-SA ports
#SRCDIR?=	${ROOTDIR}/src             # Repo FreeBSD source
#PORTSREFDIR?=	${ROOTDIR}/freebsd-ports   # Repo FreeBSD ports reference
#STAGEDIRPREFIX?=/usr/obj                  # Thư mục staging build (cần nhiều space)


# ------------------------------------------------------------------------------
# 8. Ký số (SIGNING)
# ------------------------------------------------------------------------------
# Cấu hình ký số package và verify chữ ký.

#PRIVKEY?=	${CONFIGDIR}/repo.key      # Private key (mặc định: config/<ABI>/repo.key)
#PUBKEY?=	${CONFIGDIR}/repo.pub      # Public key
#SIGNCMD?=	${TOOLSDIR}/scripts/pkg_sign.sh ${PUBKEY} ${PRIVKEY}
#SIGNCHK?=	${TOOLSDIR}/scripts/pkg_fingerprint.sh ${PUBKEY}


# ------------------------------------------------------------------------------
# 9. Tuỳ biến build (BUILD CUSTOMIZATION)
# ------------------------------------------------------------------------------

#ADDITIONS?=	                # Plugins/packages bổ sung khi build image
                                # Ví dụ: ADDITIONS="net/haproxy security/acme-client"

#PORTSENV?=	                # Tuỳ chọn cho ports build
                                # Ví dụ: PORTSENV="DEPEND=no PRUNE=no"
                                # BATCH=yes/no | DEPEND=yes/no | MISMATCH=yes/no | PRUNE=yes/no

#COREENV?=	CORE_PHP=${PHP} CORE_ABI=${ABI} CORE_PYTHON=${PYTHON}
                                # Biến môi trường khi build core

#PLUGINSENV?=	PLUGIN_PHP=${PHP} PLUGIN_ABI=${ABI} PLUGIN_PYTHON=${PYTHON}
                                # Biến môi trường khi build plugins


# ------------------------------------------------------------------------------
# 10. Remote Operations (UPLOAD/DOWNLOAD)
# ------------------------------------------------------------------------------
# Cấu hình SSH server và path cho upload/download set.

#SERVER?=	user@does.not.exist        # SSH server (user@host)
#REMOTEDIR?=	                           # Đường dẫn trên remote server


# ------------------------------------------------------------------------------
# 11. Repository Configuration (YAML)
# ------------------------------------------------------------------------------
# Cấu hình URL repositories qua file YAML (xem repositories.yaml.example).

#REPOSCONFIG?=	repositories     # Tên file YAML (không có .yaml)
                                 # Path đầy đủ: ${CONFIGDIR}/${REPOSCONFIG}.yaml


# ------------------------------------------------------------------------------
# 12. Verbose / Debug Build
# ------------------------------------------------------------------------------

#VERBOSE?=	                # Bật verbose mode: '' (tắt) | '1' (bật)
                                # Khi bật, hiển thị mọi lệnh shell


# ==============================================================================
# Các biến truyền qua dòng lệnh (KHÔNG đặt trong file này)
# ==============================================================================
# Các biến sau chỉ truyền qua command line cho từng lệnh make:
#
#   PORTSLIST     - Override danh sách ports (make ports PORTSLIST="security/openssl")
#   PLUGINSLIST   - Override danh sách plugins (make plugins PLUGINSLIST="devel/debug")
#   TO            - Phiên bản đích cho clone (make clone-base TO=25.7)
#   SETTINGS      - Chọn config profile (make SETTINGS=25.7 ...)
#   CONFIGDIR     - Path tuyệt đối tới config (override SETTINGS)
# ==============================================================================
